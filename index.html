  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
    }
    
    /* Scroll-triggered animation classes */
    .scroll-animate {
        opacity: 0;
        filter: blur(8px);
        transform: translateY(20px);
        transition: opacity 0.6s ease-out, filter 0.6s ease-out, transform 0.6s ease-out;
    }
    .scroll-animate.visible {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
    }
    
    /* Collapsible content animation */
    .collapsible-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.5s ease-in-out;
      opacity: 0;
    }
    .collapsible-content.visible {
      max-height: 1000px; /* A large enough value to not clip content */
      opacity: 1;
    }

    /* General fade-in animation */
    .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-fade-in-fast {
        animation: fadeInFast 0.2s ease-out forwards;
    }
    @keyframes fadeInFast {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }


    /* Neon glow effect for buttons */
    .neon-glow {
        box-shadow: 0 0 5px #39FF14, 0 0 10px #39FF14, 0 0 15px #39FF14;
    }
    .neon-glow-hover:hover {
        box-shadow: 0 0 10px #39FF14, 0 0 20px #39FF14, 0 0 40px #39FF14;
    }
  </style>
